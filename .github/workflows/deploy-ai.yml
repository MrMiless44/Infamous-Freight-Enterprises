name: Deploy AI Dispatch

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ai-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ===== CI =====
  ci:
    name: Lint, type-check & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type-check API
        run: pnpm -C apps/api exec tsc -p tsconfig.json --noEmit

      - name: Type-check web
        run: pnpm -C apps/web exec tsc -p tsconfig.json --noEmit

      - name: Test API workspace
        run: pnpm -C apps/api run test -- --runInBand

      - name: Write CI summary
        if: always()
        run: |
          {
            echo "## Deploy AI — CI"
            echo ""
            echo "| Step | Command |"
            echo "|------|---------|"
            echo "| Install | \`pnpm install --frozen-lockfile\` |"
            echo "| Lint | \`pnpm run lint\` |"
            echo "| Type-check API | \`pnpm -C apps/api exec tsc --noEmit\` |"
            echo "| Type-check web | \`pnpm -C apps/web exec tsc --noEmit\` |"
            echo "| Tests | \`pnpm -C apps/api run test -- --runInBand\` |"
            echo ""
            echo "Ref: ${{ github.ref }}"
            echo "SHA: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===== DEPLOY =====
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    timeout-minutes: 20
    concurrency:
      group: fly-ai-production
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master (2026-04-08)

      - name: Deploy to Fly.io
        run: |
          set -euo pipefail
          max_attempts=3
          attempt=1
          until [ "$attempt" -gt "$max_attempts" ]; do
            echo "Fly deploy attempt $attempt/$max_attempts"
            if flyctl deploy --remote-only --wait-timeout 10m --strategy rolling --app infamous-freight; then
              break
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::Fly deploy failed after $max_attempts attempts."
              exit 1
            fi
            sleep $((attempt * 30))
            attempt=$((attempt + 1))
          done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify deployment health
        run: scripts/fly-post-deploy-check.sh infamous-freight https://infamous-freight.fly.dev https://api.infamousfreight.com
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Write deploy summary
        if: always()
        run: |
          {
            echo "## Deploy AI — Fly.io"
            echo ""
            echo "- App: \`infamous-freight\`"
            echo "- API: https://api.infamousfreight.com"
            echo "- SHA: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
