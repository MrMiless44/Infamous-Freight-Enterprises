name: SBOM and Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run npm audit
        run: pnpm audit --prod || true

      - name: Generate dependency snapshot
        run: pnpm list --depth 4 > dependency-tree.txt

      - name: Upload dependency artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: |
            dependency-tree.txt
