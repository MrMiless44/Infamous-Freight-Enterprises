name: Auto Assign

# Keep issue auto-assignment, but do not create a PR status check for assignment.
on:
  issues:
    types: [opened]
  workflow_dispatch:

jobs:
  assign-issue:
    name: Assign Issue
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Auto-assign issue
        uses: pozil/auto-assign-issue@d11e715efc663fe323c3d8d4d3cbbfdddd539baf # v1
        with:
          assignees: MrMiless44
          numOfAssignee: 1
