name: Release Notes

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-notes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate release summary
        run: |
          echo "# Release Summary" > RELEASE_SUMMARY.md
          echo "" >> RELEASE_SUMMARY.md
          echo "Commit: $GITHUB_SHA" >> RELEASE_SUMMARY.md
          echo "Generated: $(date -u)" >> RELEASE_SUMMARY.md
          echo "" >> RELEASE_SUMMARY.md
          echo "Recent commits:" >> RELEASE_SUMMARY.md
          git log -10 --pretty=format:'- %s (%an)' >> RELEASE_SUMMARY.md

      - name: Upload release summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-summary
          path: RELEASE_SUMMARY.md
