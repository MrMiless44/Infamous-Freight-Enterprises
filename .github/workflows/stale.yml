# Warns and then closes inactive issues and pull requests.
# Keeps the tracker tidy while exempting important/security work.
name: Mark stale issues and pull requests

on:
  schedule:
    - cron: '29 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@b5d41d4e1d5dceea10e7104786b73624c18a190f # v10.2.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: 60
          days-before-pr-stale: 30
          days-before-issue-close: 14
          days-before-pr-close: 7
          operations-per-run: 30
          remove-stale-when-updated: true

          stale-issue-label: 'status: stale'
          stale-pr-label: 'status: stale'
          exempt-issue-labels: 'pinned,security,priority: high,help wanted'
          exempt-pr-labels: 'pinned,security,dependencies,priority: high'

          stale-issue-message: >-
            This issue has had no activity for 60 days, so it has been marked stale.
            Add a comment or remove the stale label if this is still needed.
          stale-pr-message: >-
            This pull request has had no activity for 30 days, so it has been marked stale.
            Please rebase, respond to feedback, or close it if it is no longer needed.
          close-issue-message: >-
            Closing this issue after 14 more days without activity. Reopen it if the work is still relevant.
          close-pr-message: >-
            Closing this pull request after 7 more days without activity. Reopen or recreate it when ready.
