# Third-party Fortify scan. Runs on main, schedule, and manual dispatch so
# normal PRs are not blocked by vendor credentials or long-running AST scans.
name: Fortify AST Scan

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '44 18 * * 6'
  workflow_dispatch:

jobs:
  Fortify-AST-Scan:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check Out Source Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Fortify Scan
        uses: fortify/github-action@f5c8bee6e953e4610c35e1123cb6d90bc56fafe1
        with:
          sast-scan: true
          debricked-sca-scan: true
        env:
          FOD_URL: https://ams.fortify.com
          FOD_TENANT: ${{secrets.FOD_TENANT}}
          FOD_USER: ${{secrets.FOD_USER}}
          FOD_PASSWORD: ${{secrets.FOD_PAT}}
          SSC_URL: ${{vars.SSC_URL}}
          SSC_TOKEN: ${{secrets.SSC_TOKEN}}
          SC_SAST_TOKEN: ${{secrets.SC_CLIENT_AUTH_TOKEN}}
          DEBRICKED_TOKEN: ${{secrets.DEBRICKED_TOKEN}}
          SC_SAST_SENSOR_VERSION: 24.4.0
