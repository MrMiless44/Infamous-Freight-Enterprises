name: Deploy Fly API

on:
  workflow_call:
    secrets:
      FLY_API_TOKEN:
        required: true
      DATABASE_URL:
        required: false
      SUPABASE_URL:
        required: false
      SUPABASE_SERVICE_KEY:
        required: false
      SUPABASE_SERVICE_ROLE_KEY:
        required: false
      SUPABASE_JWT_SECRET:
        required: false
      STRIPE_SECRET_KEY:
        required: false
      STRIPE_WEBHOOK_SECRET:
        required: false
      REDIS_URL:
        required: false
      REDIS_HOST:
        required: false
      REDIS_PASSWORD:
        required: false
      SENTRY_DSN:
        required: false
      SENTRY_AUTH_TOKEN:
        required: false
      DAT_API_KEY:
        required: false
      TRUCKSTOP_API_KEY:
        required: false
      LOADBOARD_API_KEY:
        required: false
      SAMSARA_API_TOKEN:
        required: false
      MOTIVE_CLIENT_ID:
        required: false
      MOTIVE_CLIENT_SECRET:
        required: false
      QBO_CLIENT_ID:
        required: false
      QBO_CLIENT_SECRET:
        required: false
      XERO_CLIENT_ID:
        required: false
      XERO_CLIENT_SECRET:
        required: false
      SENDGRID_API_KEY:
        required: false
      RTS_API_KEY:
        required: false
      OTR_API_KEY:
        required: false
      APEX_API_KEY:
        required: false
  workflow_dispatch:

concurrency:
  group: deploy-fly-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  FLY_API_URL: https://api.infamousfreight.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CI: true
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      REDIS_HOST: ${{ secrets.REDIS_HOST }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      DAT_API_KEY: ${{ secrets.DAT_API_KEY }}
      TRUCKSTOP_API_KEY: ${{ secrets.TRUCKSTOP_API_KEY }}
      LOADBOARD_API_KEY: ${{ secrets.LOADBOARD_API_KEY }}
      SAMSARA_API_TOKEN: ${{ secrets.SAMSARA_API_TOKEN }}
      MOTIVE_CLIENT_ID: ${{ secrets.MOTIVE_CLIENT_ID }}
      MOTIVE_CLIENT_SECRET: ${{ secrets.MOTIVE_CLIENT_SECRET }}
      QBO_CLIENT_ID: ${{ secrets.QBO_CLIENT_ID }}
      QBO_CLIENT_SECRET: ${{ secrets.QBO_CLIENT_SECRET }}
      XERO_CLIENT_ID: ${{ secrets.XERO_CLIENT_ID }}
      XERO_CLIENT_SECRET: ${{ secrets.XERO_CLIENT_SECRET }}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
      RTS_API_KEY: ${{ secrets.RTS_API_KEY }}
      OTR_API_KEY: ${{ secrets.OTR_API_KEY }}
      APEX_API_KEY: ${{ secrets.APEX_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d  # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm -C apps/api run prisma:generate

      - name: Build API
        run: pnpm -C apps/api run build

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1  # master (2026-04-08)

      - name: Resolve Fly app details
        id: fly
        run: |
          set -euo pipefail
          fly_app_name="$(awk -F'"' '/^app =/ {print $2}' fly.toml)"
          if [ -z "$fly_app_name" ]; then
            echo "::error::Could not determine Fly app name from fly.toml."
            exit 1
          fi
          echo "fly_app_name=$fly_app_name" >> "$GITHUB_OUTPUT"
          echo "fly_app_url=https://${fly_app_name}.fly.dev" >> "$GITHUB_OUTPUT"

      - name: Deploy to Fly.io
        run: |
          set -euo pipefail
          max_attempts=3
          attempt=1
          until [ "$attempt" -gt "$max_attempts" ]; do
            echo "Fly deploy attempt $attempt/$max_attempts"
            if flyctl deploy --remote-only --config fly.toml --app "${{ steps.fly.outputs.fly_app_name }}" --wait-timeout 10m --strategy rolling; then
              break
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::Fly deploy failed after $max_attempts attempts."
              exit 1
            fi
            sleep $((attempt * 30))
            attempt=$((attempt + 1))
          done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify deployment health
        run: scripts/fly-post-deploy-check.sh "${{ steps.fly.outputs.fly_app_name }}" "${{ steps.fly.outputs.fly_app_url }}" "$FLY_API_URL"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Write deploy summary
        if: always()
        run: |
          {
            echo "## Deploy Fly API"
            echo ""
            echo "- App: \`${{ steps.fly.outputs.fly_app_name }}\`"
            echo "- Fly URL: ${{ steps.fly.outputs.fly_app_url }}"
            echo "- API URL: $FLY_API_URL"
            echo "- SHA: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
