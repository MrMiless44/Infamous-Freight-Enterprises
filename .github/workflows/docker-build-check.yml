name: Docker Build Check

# Docker image validation is covered by Full Validation on main/manual runs.
# Keep it off pull_request events to avoid duplicate heavy build checks.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build Docker image
        run: docker build -t infamous-freight-check -f Dockerfile .
