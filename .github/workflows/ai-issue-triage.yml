name: AI Issue Triage

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  triage:
    name: Label and summarize issues
    if: ${{ github.event_name == 'workflow_dispatch' || (github.actor != 'github-actions[bot]' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_TRIAGE_MODEL: ${{ vars.OPENAI_TRIAGE_MODEL || 'gpt-5.4-mini' }}
      REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Apply deterministic labels and optional AI summary
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${ISSUE_NUMBER:-}" ]]; then
            echo "No issue payload found. This workflow should be run by an issue event."
            exit 0
          fi

          python3 <<'PY' > /tmp/labels.txt
          import json
          import os
          import re

          with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as f:
              event = json.load(f)

          issue = event.get("issue") or {}
          text = f"{issue.get('title', '')}\n\n{issue.get('body') or ''}".lower()

          labels = {"needs-triage"}
          rules = [
              (r"bug|error|broken|fail|crash|exception", "bug"),
              (r"security|vulnerability|secret|token|auth", "security"),
              (r"deploy|netlify|fly|docker|runner|workflow|ci|cd", "infrastructure"),
              (r"stripe|billing|invoice|checkout|payment", "billing"),
              (r"driver|dispatch|load|shipment|carrier|freight", "freight-ops"),
              (r"quote|reliability|rate[\s\-]?confirm", "quote-ops"),
              (r"ai|openai|agent|automation|triage", "ai"),
          ]

          for pattern, label in rules:
              if re.search(pattern, text):
                  labels.add(label)

          for label in sorted(labels):
              print(label)
          PY

          while IFS= read -r label; do
            [[ -z "${label}" ]] && continue
            gh label create "${label}" --repo "${REPO}" --color EDEDED --force >/dev/null 2>&1 || true
            gh issue edit "${ISSUE_NUMBER}" --repo "${REPO}" --add-label "${label}"
          done < /tmp/labels.txt

          python3 <<'PY' > /tmp/triage-comment.md
          import json
          import os
          import urllib.error
          import urllib.request

          with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as f:
              event = json.load(f)

          issue = event.get("issue") or {}
          title = issue.get("title", "")
          body = issue.get("body") or ""
          labels = [line.strip() for line in open("/tmp/labels.txt", encoding="utf-8") if line.strip()]

          api_key = os.environ.get("OPENAI_API_KEY", "").strip()
          model = os.environ.get("OPENAI_TRIAGE_MODEL", "gpt-5.4-mini").strip() or "gpt-5.4-mini"

          if not api_key:
              print("Deterministic triage labels applied. `OPENAI_API_KEY` was not visible to this workflow run, so no AI summary was generated. Confirm the secret is saved in this repository or organization and is allowed for GitHub Actions.")
              raise SystemExit(0)

          prompt = f"""
          You are triaging a GitHub issue for Infamous Freight, a freight/logistics platform.
          Produce a concise markdown comment with:
          - likely category
          - urgency
          - recommended owner/team
          - next 3 actions
          - risk notes

          Keep claims conservative. Do not invent business facts.

          Issue title:
          {title}

          Issue body:
          {body}

          Deterministic labels:
          {', '.join(labels)}
          """.strip()

          payload = {
              "model": model,
              "input": prompt,
              "instructions": "You are a production-minded GitHub issue triage assistant. Be concise, safe, and operationally practical.",
              "store": False,
          }

          req = urllib.request.Request(
              "https://api.openai.com/v1/responses",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = json.loads(resp.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", errors="replace")[:1000]
              print(f"Deterministic triage labels applied. OpenAI API request failed with HTTP {exc.code}. Check `OPENAI_API_KEY`, billing, and optional `OPENAI_TRIAGE_MODEL`. Details: `{detail}`")
              raise SystemExit(0)
          except Exception as exc:
              print(f"Deterministic triage labels applied. OpenAI API request failed before completion: `{exc}`")
              raise SystemExit(0)

          output_text = data.get("output_text")
          if not output_text:
              parts = []
              for item in data.get("output", []):
                  for content in item.get("content", []):
                      text = content.get("text")
                      if text:
                          parts.append(text)
              output_text = "\n".join(parts).strip()

          marker = "<!-- ai-issue-triage-summary -->"
          if output_text:
              print(marker + "\nAI-assisted triage summary generated.\n\n" + output_text)
          else:
              print(marker + "\nDeterministic triage labels applied. OpenAI returned no readable summary text.")
          PY

          existing_comment_ids=""
          if ! existing_comment_ids="$(gh api "repos/${REPO}/issues/${ISSUE_NUMBER}/comments" --paginate --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- ai-issue-triage-summary -->"))) | .id')"; then
            echo "Warning: unable to query existing AI triage comments for issue #${ISSUE_NUMBER}. Continuing with a new triage comment." >&2
            existing_comment_ids=""
          fi
          if [[ -n "${existing_comment_ids}" ]]; then
            while IFS= read -r comment_id; do
              [[ -z "${comment_id}" ]] && continue
              if ! delete_error="$(gh api --method DELETE "repos/${REPO}/issues/comments/${comment_id}" 2>&1)"; then
                echo "Warning: unable to delete previous AI triage comment ${comment_id} for issue #${ISSUE_NUMBER}. Details: ${delete_error}" >&2
              fi
            done <<< "${existing_comment_ids}"
          fi

          gh issue comment "${ISSUE_NUMBER}" --repo "${REPO}" --body-file /tmp/triage-comment.md
