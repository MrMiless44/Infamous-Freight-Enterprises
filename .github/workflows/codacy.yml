# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature.  For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '33 15 * * 3'

concurrency:
  group: codacy-security-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    # Skip on pull requests opened from forks: CODACY_PROJECT_TOKEN is not
    # exposed to fork PR workflows, and GITHUB_TOKEN's `security-events: write`
    # permission is downgraded to read-only for fork PRs, so the SARIF upload
    # step would fail. Codacy still runs on push to main, schedule, and
    # same-repo PRs, which is sufficient coverage.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Execute Codacy Analysis CLI and generate a SARIF output with the security issues identified during the analysis
      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08
        with:
          # Check https://github.com/codacy/codacy-analysis-cli#project-token to get your project token from your Codacy repository
          # You can also omit the token and run the tools that support default configurations
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          # Adjust severity of non-security issues
          gh-code-scanning-compat: true
          # Force 0 exit code to allow SARIF file generation
          # This will handover control about PR rejection to the GitHub side
          max-allowed-issues: 2147483647

      # github/codeql-action/upload-sarif@v4 rejects SARIF files that contain
      # multiple runs sharing the same category (see
      # https://github.blog/changelog/2025-07-21-code-scanning-will-stop-combining-multiple-sarif-runs-uploaded-in-the-same-sarif-file/).
      # The Codacy CLI emits a single results.sarif with one run per tool, so
      # split it into one SARIF file per run and upload each separately with a
      # unique category via the Code Scanning API.
      - name: Upload SARIF results (one category per tool)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_REF: ${{ github.event.pull_request.head.ref && format('refs/heads/{0}', github.event.pull_request.head.ref) || github.ref }}
        run: |
          set -euo pipefail
          if [ ! -s results.sarif ]; then
            echo "No results.sarif produced by Codacy; nothing to upload."
            exit 0
          fi
          run_count=$(jq '.runs | length' results.sarif)
          echo "Found ${run_count} SARIF run(s) in results.sarif"
          if [ "${run_count}" = "0" ]; then
            exit 0
          fi
          mkdir -p sarif-split
          for i in $(seq 0 $((run_count - 1))); do
            tool=$(jq -r --argjson i "$i" '
              (.runs[$i].tool.driver.name // "")
              | gsub("[^A-Za-z0-9_.-]"; "_")
              | if . == "" then "tool-\($i)" else . end
            ' results.sarif)
            file="sarif-split/codacy-${i}-${tool}.sarif"
            category="codacy-${tool}"
            # Embed the unique category as runs[0].automationDetails.id inside
            # the SARIF document itself. The Code Scanning "upload an analysis
            # as SARIF data" REST API does not accept a top-level "category"
            # parameter; per-run categories must be carried in the SARIF.
            jq --argjson i "$i" --arg category "$category" '{
              "$schema": .["$schema"],
              version: .version,
              runs: [ .runs[$i] | .automationDetails = ((.automationDetails // {}) + {id: $category}) ]
            }' results.sarif > "$file"
            echo "Uploading ${file} with category ${category}"
            sarif_b64=$(gzip -c "$file" | base64 -w0)
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/code-scanning/sarifs" \
              -f commit_sha="${GITHUB_SHA}" \
              -f ref="${GITHUB_REF}" \
              -f sarif="${sarif_b64}" \
              -F validate=true
          done
