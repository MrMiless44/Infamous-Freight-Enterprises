# Third-party Codacy security scan. Runs on main, schedule, and manual dispatch
# so PRs are not blocked by vendor-token or SARIF-upload noise.
name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '33 15 * * 3'
  workflow_dispatch:

concurrency:
  group: codacy-security-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647

      - name: Upload SARIF results (one category per tool)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ ! -s results.sarif ]; then
            echo "No results.sarif produced by Codacy; nothing to upload."
            exit 0
          fi
          run_count=$(jq '.runs | length' results.sarif)
          echo "Found ${run_count} SARIF run(s) in results.sarif"
          if [ "${run_count}" = "0" ]; then
            exit 0
          fi
          mkdir -p sarif-split
          for i in $(seq 0 $((run_count - 1))); do
            tool=$(jq -r --argjson i "$i" '
              (.runs[$i].tool.driver.name // "")
              | gsub("[^A-Za-z0-9_.-]"; "_")
              | if . == "" then "tool-\($i)" else . end
            ' results.sarif)
            file="sarif-split/codacy-${i}-${tool}.sarif"
            category="codacy-${tool}"
            jq --argjson i "$i" --arg category "$category" '{
              "$schema": .["$schema"],
              version: .version,
              runs: [ .runs[$i] | .automationDetails = ((.automationDetails // {}) + {id: $category}) ]
            }' results.sarif > "$file"
            echo "Uploading ${file} with category ${category}"
            sarif_b64=$(gzip -c "$file" | base64 -w0)
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/code-scanning/sarifs" \
              -f commit_sha="${GITHUB_SHA}" \
              -f ref="${GITHUB_REF}" \
              -f sarif="${sarif_b64}" \
              -F validate=true
          done
