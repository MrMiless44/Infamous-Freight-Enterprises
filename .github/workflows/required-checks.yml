name: Required Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: required-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required-checks:
    name: Required Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci_user:ci_pass@127.0.0.1:5432/ci_db?schema=public
      STRIPE_SECRET_KEY: sk_test_ci_1234567890
      STRIPE_WEBHOOK_SECRET: whsec_ci_1234567890
      SUPABASE_URL: https://ci.supabase.co
      VITE_SUPABASE_URL: https://ci.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: service_role_ci_1234567890
      VITE_SUPABASE_ANON_KEY: anon_ci_1234567890
      WEB_APP_URL: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      RATE_LIMIT_ENABLED: "true"
      API_RATE_LIMIT_ENABLED: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v4.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Verify required environment variables
        id: env_strict
        run: pnpm run codex:env-check:strict

      - name: Verify frontend env safety
        id: env_frontend
        run: pnpm run env:check:frontend

      - name: Verify Supabase client env safety
        id: env_supabase
        run: pnpm run env:check:supabase-client

      - name: Generate Prisma client
        id: prisma
        run: pnpm run prisma:generate

      - name: Lint
        id: lint
        run: pnpm run lint

      - name: Typecheck API
        id: typecheck_api
        run: pnpm -C apps/api exec tsc -p tsconfig.json --noEmit

      - name: Typecheck web
        id: typecheck_web
        run: pnpm -C apps/web exec tsc -p tsconfig.json --noEmit

      - name: API coverage tests
        id: api_coverage
        run: pnpm -C apps/api run test:coverage

      - name: Write required-checks summary
        if: always()
        run: |
          {
            echo "## Required Checks Summary"
            echo ""
            echo "- install: ${{ steps.install.outcome }}"
            echo "- env strict: ${{ steps.env_strict.outcome }}"
            echo "- frontend env safety: ${{ steps.env_frontend.outcome }}"
            echo "- supabase env safety: ${{ steps.env_supabase.outcome }}"
            echo "- prisma generate: ${{ steps.prisma.outcome }}"
            echo "- lint: ${{ steps.lint.outcome }}"
            echo "- API typecheck: ${{ steps.typecheck_api.outcome }}"
            echo "- web typecheck: ${{ steps.typecheck_web.outcome }}"
            echo "- API coverage: ${{ steps.api_coverage.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
