<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Infamous Freight</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #080204;
      color: #F5E8E8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .container { max-width: 480px; text-align: center; }
    h1 { font-size: 4rem; font-weight: 900; color: #FF1A1A; line-height: 1; }
    h2 { font-size: 1.5rem; font-weight: 700; margin-top: 1rem; }
    p { margin-top: 1rem; color: #B88989; line-height: 1.6; }
    .actions { margin-top: 2rem; display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      font-weight: 600;
      font-size: 0.875rem;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    a:hover { opacity: 0.85; }
    .btn-primary { background: #FF1A1A; color: #F5E8E8; }
    .btn-secondary { border: 1px solid #3a2020; color: #F5E8E8; background: transparent; }
  </style>
</head>
<body>
  <main class="container">
    <h1>404</h1>
    <h2>Page not found</h2>
    <p>The page you are looking for does not exist or has been moved. Check the URL or use the links below to continue.</p>
    <div class="actions">
      <a href="/" class="btn-primary">Back to Home</a>
      <a href="/request-quote" class="btn-secondary">Request a Quote</a>
      <a href="/contact" class="btn-secondary">Contact Dispatch</a>
    </div>
  </main>
</body>
</html>
