<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Infamous Freight forms</title>
  </head>
  <body>
    <form name="quote-request" method="POST" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input type="hidden" name="form-name" value="quote-request" />
      <input name="bot-field" />
      <input name="csrf-token" />
      <input name="company" />
      <input name="contact" />
      <input name="email" />
      <input name="phone" />
      <input name="origin" />
      <input name="destination" />
      <input name="freightType" />
      <input name="equipment" />
      <input name="weight" />
      <input name="dimensions" />
      <input name="pickupDate" />
      <input name="deliveryDate" />
      <input name="attachment" type="file" />
      <textarea name="instructions"></textarea>
    </form>

    <form name="driver-application" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="driver-application" />
      <input name="bot-field" />
      <input name="csrf-token" />
      <input name="fullName" />
      <input name="email" />
      <input name="phone" />
      <input name="city" />
      <input name="state" />
      <input name="equipment" />
      <textarea name="notes"></textarea>
    </form>

    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="csrf-token" />
      <input name="name" />
      <input name="company" />
      <input name="email" />
      <input name="phone" />
      <input name="topic" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
