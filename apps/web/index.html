<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080204" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Infamous Freight" />
    <link rel="canonical" href="https://www.infamousfreight.com/" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="description"
      content="Infamous Freight is a verified freight command center for quote intake, dispatch coordination, carrier execution, shipment visibility, and proof workflows."
    />
    <meta property="og:title" content="Infamous Freight — Verified Freight Command" />
    <meta property="og:description" content="Quote intake, dispatch coordination, carrier execution, shipment visibility, and proof workflows for freight teams." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.infamousfreight.com/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Infamous Freight — Verified Freight Command" />
    <meta name="twitter:description" content="Quote intake, dispatch coordination, carrier execution, shipment visibility, and proof workflows for freight teams." />
    <meta name="twitter:image" content="https://www.infamousfreight.com/.netlify/images?url=/og-image.svg&w=1200&h=630&fit=cover&fm=png" />
    <title>Infamous Freight — Verified Freight Command</title>
    <link rel="dns-prefetch" href="https://infamous-freight.fly.dev" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }
      body {
        background: #080204;
        color: #F5E8E8;
        margin: 0;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .skip-link {
        position: absolute;
        left: -9999px;
        top: -9999px;
      }
      .skip-link:focus {
        left: 1rem;
        top: 1rem;
        z-index: 100;
        padding: 0.5rem 0.75rem;
        background: #FF1A1A;
        color: #F5E8E8;
        border-radius: 6px;
        text-decoration: none;
      }
      .app-shell-fallback {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: radial-gradient(circle at top, rgba(255, 26, 26, 0.22), transparent 35%), linear-gradient(180deg, #160608 0%, #080204 100%);
        color: #F5E8E8;
        text-align: center;
      }
      .app-shell-fallback__card {
        max-width: 560px;
      }
      .app-shell-fallback__eyebrow {
        color: #FF3B30;
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin: 0 0 0.75rem;
        font-family: "Space Grotesk", system-ui, sans-serif;
      }
      .app-shell-fallback__title {
        font-size: clamp(2rem, 7vw, 4rem);
        line-height: 0.95;
        margin: 0 0 1rem;
        font-family: "Space Grotesk", system-ui, sans-serif;
      }
      .app-shell-fallback__copy {
        color: #B88989;
        font-size: 1rem;
        line-height: 1.65;
        margin: 0;
      }
      .noscript-nav { margin-top: 2rem; display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
      .noscript-nav a { color: #FF3B30; text-decoration: underline; font-size: 0.95rem; }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div id="root">
      <main class="app-shell-fallback" aria-live="polite">
        <section class="app-shell-fallback__card">
          <p class="app-shell-fallback__eyebrow">INFAMOUS FREIGHT</p>
          <h1 class="app-shell-fallback__title">Loading freight command center...</h1>
          <p class="app-shell-fallback__copy">
            Dispatch, visibility, rate tools, and carrier operations are loading.
          </p>
          <noscript>
            <nav class="noscript-nav" aria-label="Site navigation">
              <a href="/request-quote">Request a Quote</a>
              <a href="/track-shipment">Track Shipment</a>
              <a href="/services">Services</a>
              <a href="/pricing">Pricing</a>
              <a href="/drive">Apply to Drive</a>
              <a href="/load-board">Load Board</a>
              <a href="/resources">Resources</a>
              <a href="/contact">Contact</a>
              <a href="/about">About</a>
            </nav>
          </noscript>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
