<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Infamous Freight" />
    <link rel="canonical" href="https://www.infamousfreight.com/" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="description"
      content="INFAMOUS FREIGHT is an AI-powered freight command center with auto-dispatch, rate negotiation, voice booking, ELD sync, and end-to-end shipment visibility."
    />
    <title>INFAMOUS FREIGHT — AI Freight Command Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />
    <link rel="dns-prefetch" href="https://infamous-freight.fly.dev" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }
      body {
        background: #0a0a0a;
        color: #f8fafc;
        margin: 0;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .skip-link {
        position: absolute;
        left: -9999px;
        top: -9999px;
      }
      .skip-link:focus {
        left: 1rem;
        top: 1rem;
        z-index: 100;
        padding: 0.5rem 0.75rem;
        background: #ff6a00;
        color: #fff;
        border-radius: 6px;
        text-decoration: none;
      }
      .app-shell-fallback {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: radial-gradient(circle at top left, rgba(255, 106, 0, 0.2), transparent 32rem), #0a0a0a;
        color: #f8fafc;
        text-align: center;
      }
      .app-shell-fallback__card {
        max-width: 560px;
      }
      .app-shell-fallback__eyebrow {
        color: #ff8a33;
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin: 0 0 0.75rem;
      }
      .app-shell-fallback__title {
        font-size: clamp(2rem, 7vw, 4rem);
        line-height: 0.95;
        margin: 0 0 1rem;
      }
      .app-shell-fallback__copy {
        color: #cbd5e1;
        font-size: 1rem;
        line-height: 1.65;
        margin: 0;
      }
      .noscript-nav { margin-top: 2rem; display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
      .noscript-nav a { color: #ff8a33; text-decoration: underline; font-size: 0.95rem; }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div id="root">
      <main class="app-shell-fallback" aria-live="polite">
        <section class="app-shell-fallback__card">
          <p class="app-shell-fallback__eyebrow">INFAMOUS FREIGHT</p>
          <h1 class="app-shell-fallback__title">Loading freight command center...</h1>
          <p class="app-shell-fallback__copy">
            Dispatch, visibility, rate tools, and carrier operations are loading.
          </p>
          <noscript>
            <nav class="noscript-nav" aria-label="Site navigation">
              <a href="/request-quote">Request a Quote</a>
              <a href="/track-shipment">Track Shipment</a>
              <a href="/services">Services</a>
              <a href="/pricing">Pricing</a>
              <a href="/drive">Apply to Drive</a>
              <a href="/load-board">Load Board</a>
              <a href="/resources">Resources</a>
              <a href="/contact">Contact</a>
              <a href="/about">About</a>
            </nav>
          </noscript>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
