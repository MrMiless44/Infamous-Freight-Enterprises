# Netlify Configuration for Infamous Freight Frontend

[build]
  command = "pnpm run build:web"
  publish = "apps/web/dist"

# Environment variables
[build.environment]
  NODE_VERSION = "22.13.0"
  VITE_API_URL = "https://api.infamousfreight.fly.dev"
  VITE_SUPABASE_URL = "https://your-project.supabase.co"

# Redirects - All subdomains and paths lead to main site
[[redirects]]
  from = "https://api.infamousfreight.com/*"
  to = "https://www.infamousfreight.com/"
  status = 301
  force = true

[[redirects]]
  from = "https://app.infamousfreight.com/*"
  to = "https://www.infamousfreight.com/"
  status = 301
  force = true

[[redirects]]
  from = "https://admin.infamousfreight.com/*"
  to = "https://www.infamousfreight.com/"
  status = 301
  force = true

[[redirects]]
  from = "https://dispatch.infamousfreight.com/*"
  to = "https://www.infamousfreight.com/"
  status = 301
  force = true

[[redirects]]
  from = "https://driver.infamousfreight.com/*"
  to = "https://www.infamousfreight.com/"
  status = 301
  force = true

[[redirects]]
  from = "https://broker.infamousfreight.com/*"
  to = "https://www.infamousfreight.com/"
  status = 301
  force = true

[[redirects]]
  from = "https://carrier.infamousfreight.com/*"
  to = "https://www.infamousfreight.com/"
  status = 301
  force = true

[[redirects]]
  from = "https://infamousfreight.com/*"
  to = "https://www.infamousfreight.com/:splat"
  status = 301
  force = true

# SPA fallback - serve index.html for all routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://*.supabase.co https://www.google-analytics.com https://stats.g.doubleclick.net; connect-src 'self' https://infamous-freight.fly.dev https://api.infamousfreight.com https://*.supabase.co wss://*.supabase.co https://api.stripe.com https://*.sentry.io https://*.ingest.sentry.io https://www.google-analytics.com https://www.googletagmanager.com; frame-src https://js.stripe.com https://hooks.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; worker-src 'self'"

# Cache control
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Context-specific settings
[context.production]
  command = "pnpm run build:web"
  environment = { NODE_ENV = "production" }

[context.deploy-preview]
  command = "pnpm run build:web"
  environment = { NODE_ENV = "development" }

[context.branch-deploy]
  command = "pnpm run build:web"
  environment = { NODE_ENV = "development" }
