# fly.toml app configuration file generated for infamous-freight-api on 2026-05-12T14:31:39Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'infamous-freight-api'
primary_region = 'dfw'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'rolling'
  wait_timeout = '10m0s'

[env]
  HOST = '0.0.0.0'
  NODE_ENV = 'production'
  PORT = '3000'

[processes]
  app = 'node apps/api/dist/src/server.js'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 40
    soft_limit = 25

  [[http_service.checks]]
    interval = '30s'
    timeout = '15s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/api/health/live'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
