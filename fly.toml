# fly.toml app configuration file generated for infamous-freight-api on 2026-05-11T21:28:05Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "infamous-freight-api"
primary_region = "dfw"

[build]
dockerfile = "Dockerfile"

[deploy]
strategy = "rolling"
wait_timeout = "10m0s"

[processes]
app = "node apps/api/dist/src/server.js"

[env]
HOST = "0.0.0.0"
NODE_ENV = "production"
PORT = "3000"

[http_service]
auto_start_machines = true
auto_stop_machines = false
force_https = true
internal_port = 3_000
min_machines_running = 1
processes = [ "app" ]

  [[http_service.checks]]
  grace_period = "1m30s"
  interval = "30s"
  method = "GET"
  path = "/api/health/live"
  timeout = "15s"

  [http_service.concurrency]
  hard_limit = 40
  soft_limit = 25
  type = "requests"

[[vm]]
  cpu_kind = "performance"
  cpus = 1
  memory = "2gb"
  memory_mb = 2_048
  size = "performance-cpu-1x"
