[build]
  publish = "apps/web/dist"
  command = "pnpm run build:web"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  SENTRY_DISABLE_UPLOAD = "true"

[[redirects]]
  from = "https://infamousfreight.com/*"
  to = "https://www.infamousfreight.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://infamous-freight.netlify.app/*"
  to = "https://www.infamousfreight.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/health"
  to = "https://infamous-freight-api.fly.dev/api/health"
  status = 200
  force = true

[[redirects]]
  from = "/api/load-requests"
  to = "/.netlify/functions/load-requests"
  status = 200
  force = true

[[redirects]]
  from = "/api/load-requests/*"
  to = "/.netlify/functions/load-requests/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/public/quote-requests"
  to = "/.netlify/functions/public-freight"
  status = 200
  force = true

[[redirects]]
  from = "/api/public/shipments/:trackingNumber"
  to = "/.netlify/functions/public-freight?trackingNumber=:trackingNumber"
  status = 200
  force = true

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

# Accounts / Auth
[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/accounts"
  status = 200
  force = true

# Loads
[[redirects]]
  from = "/api/loads/*"
  to = "/.netlify/functions/loads"
  status = 200
  force = true

[[redirects]]
  from = "/api/loads"
  to = "/.netlify/functions/loads"
  status = 200
  force = true

# Carriers
[[redirects]]
  from = "/api/carriers/*"
  to = "/.netlify/functions/carriers"
  status = 200
  force = true

[[redirects]]
  from = "/api/carriers"
  to = "/.netlify/functions/carriers"
  status = 200
  force = true

# Drivers
[[redirects]]
  from = "/api/drivers/*"
  to = "/.netlify/functions/drivers"
  status = 200
  force = true

[[redirects]]
  from = "/api/drivers"
  to = "/.netlify/functions/drivers"
  status = 200
  force = true

# ELD / HOS
[[redirects]]
  from = "/api/eld/*"
  to = "/.netlify/functions/drivers"
  status = 200
  force = true

# GPS Tracking
[[redirects]]
  from = "/api/tracking/*"
  to = "/.netlify/functions/tracking"
  status = 200
  force = true

# Quotes / Pricing
[[redirects]]
  from = "/api/quotes/*"
  to = "/.netlify/functions/quotes"
  status = 200
  force = true

[[redirects]]
  from = "/api/quotes"
  to = "/.netlify/functions/quotes"
  status = 200
  force = true

# Documents
[[redirects]]
  from = "/api/documents/*"
  to = "/.netlify/functions/documents"
  status = 200
  force = true

# Invoices
[[redirects]]
  from = "/api/invoices/*"
  to = "/.netlify/functions/invoices"
  status = 200
  force = true

[[redirects]]
  from = "/api/invoices"
  to = "/.netlify/functions/invoices"
  status = 200
  force = true

# Notifications
[[redirects]]
  from = "/api/notifications/*"
  to = "/.netlify/functions/notifications-api"
  status = 200
  force = true

[[redirects]]
  from = "/api/notifications"
  to = "/.netlify/functions/notifications-api"
  status = 200
  force = true

# Mobile App Backend
[[redirects]]
  from = "/api/mobile/*"
  to = "/.netlify/functions/mobile"
  status = 200
  force = true

# Fly.io fallback for remaining API routes
[[redirects]]
  from = "/api/*"
  to = "https://infamous-freight-api.fly.dev/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/socket.io/*"
  to = "https://infamous-freight-api.fly.dev/socket.io/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*.map"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://*.supabase.co https://www.google-analytics.com https://stats.g.doubleclick.net; connect-src 'self' https://infamous-freight-api.fly.dev https://api.infamousfreight.com https://*.supabase.co wss://*.supabase.co https://api.stripe.com https://*.sentry.io https://*.ingest.sentry.io https://www.google-analytics.com https://www.googletagmanager.com; frame-src https://js.stripe.com https://hooks.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; worker-src 'none'; upgrade-insecure-requests"
    Cross-Origin-Embedder-Policy = "credentialless"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Resource-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self https://js.stripe.com), usb=(), bluetooth=(), serial=(), hid=(), accelerometer=(), gyroscope=(), magnetometer=(), ambient-light-sensor=(), autoplay=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(self), idle-detection=(), interest-cohort=(), picture-in-picture=(self), screen-wake-lock=(), xr-spatial-tracking=()"
    X-Powered-By = ""
    X-DNS-Prefetch-Control = "off"
    X-Permitted-Cross-Domain-Policies = "none"

[[headers]]
  for = "/driver-pwa/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; font-src 'self' data:; img-src 'self' data:; connect-src 'self' https://infamous-freight-api.fly.dev https://api.infamousfreight.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; worker-src 'self'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Embedder-Policy = "credentialless"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), serial=(), hid=(), accelerometer=(), gyroscope=(), magnetometer=(), ambient-light-sensor=(), autoplay=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(self), idle-detection=(), interest-cohort=(), picture-in-picture=(), screen-wake-lock=(), xr-spatial-tracking=()"
    X-Powered-By = ""
    X-DNS-Prefetch-Control = "off"
    X-Permitted-Cross-Domain-Policies = "none"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/**/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/**/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/driver-pwa/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/**/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/**/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/**/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/**/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/**/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
